
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header>
            <h1>TaskFlow</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <main class="task-container">
            <h2>My Tasks</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                    aria-label="Enter a new task"
                >
                <button type="submit" id="addTaskBtn">
                    Add Task
                </button>
            </form>

            <ul id="taskList" aria-live="polite"></ul>

            <p id="emptyMessage">
                No tasks yet. Add your first task!
            </p>
        </main>

        <footer>
            <p>Stay focused. Get things done.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
